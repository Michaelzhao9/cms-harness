<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{ site_name }}</title>
<link rel="icon" href="/admin/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/static/admin.css?v={{ css_v }}">
</head>
<body class="signin">
<main class="signin-grid">
<section class="signin-form">
<span class="signin-site"><img class="logo" src="/admin/static/logo.svg" alt="" width="22" height="22">{{ site_name }}</span>
<div class="signin-body">
<div class="signin-head">
<h1>登录后台</h1>
<p>进去之后，想改什么直接说。</p>
</div>
<form method="post" action="/admin/login">
<div class="fd"><label for="email">邮箱</label>
<input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
<div class="fd"><label for="password">密码</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
{% if error %}<span class="error" role="alert">{{ error }}</span>{% endif %}</div>
<button type="submit">登录</button>
</form>
<p class="signin-note">忘记密码时，请站点的搭建者在服务器上用 <code>cms-harness admin 邮箱</code> 重置。后台不提供自助找回。</p>
</div>
<span class="signin-foot">由 CMS Harness 驱动</span>
</section>
<div class="signin-art" aria-hidden="true"><img src="/admin/static/logo.svg" alt="" width="88" height="88"></div>
</main>
</body>
</html>
