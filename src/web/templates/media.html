{% extends "base.html" %}
{% block title %}素材库{% endblock %}
{% block main %}
<div class="content">
<section class="records" aria-label="素材库">
<header class="head">
<h1>素材库</h1>
<span class="sum">{{ files|length }} 个文件</span>
</header>
<form class="upload" method="post" action="/admin/media" enctype="multipart/form-data">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label class="lb" for="file">上传图片或 PDF，最大 {{ max_mb }} MB</label>
<input id="file" type="file" name="file" accept="image/jpeg,image/png,image/gif,image/webp,application/pdf" required>
<button type="submit" class="btn">上传</button>
</form>
{% if error %}<p class="note bad" role="alert">{{ error }}</p>{% endif %}
<ul class="grid">
{% for f in files -%}
<li><figure>{% if f.image %}<img src="/uploads/{{ f.name }}" alt="" loading="lazy">{% else %}<span class="pdf">PDF</span>{% endif %}
<figcaption><a href="/uploads/{{ f.name }}" target="_blank" rel="noopener"><code>{{ f.name }}</code></a></figcaption></figure></li>
{% else -%}
<li class="empty">还没有上传过文件。</li>
{% endfor -%}
</ul>
</section>
</div>
{% endblock %}
