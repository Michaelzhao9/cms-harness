<!doctype html>
<html lang="{{ html_lang or 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}{{ site.name }}</title>
<style>
:root { color-scheme: light dark; --ink: #1d1d1f; --soft: #6e6e73; --line: #e5e5ea; --bg: #fcfcfd; }
@media (prefers-color-scheme: dark) { :root { --ink: #f2f2f4; --soft: #a1a1a8; --line: #2c2c30; --bg: #111113; } }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
header, main { max-width: 44rem; margin: 0 auto; padding: 0 24px; }
header { padding-top: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
header a { color: inherit; text-decoration: none; font-weight: 600; }
main { padding-top: 24px; padding-bottom: 64px; }
h1 { font-size: 28px; letter-spacing: -0.01em; margin: 0 0 16px; }
a { color: inherit; }
ul.list { list-style: none; padding: 0; margin: 0; }
ul.list li { padding: 12px 0; border-bottom: 1px solid var(--line); }
dl { margin: 0; } dt { color: var(--soft); font-size: 14px; margin-top: 16px; } dd { margin: 4px 0 0; }
img { max-width: 100%; height: auto; border-radius: 6px; }
.empty, .soft { color: var(--soft); }
</style>
</head>
<body>
<header><a href="/">{{ site.name }}</a></header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
