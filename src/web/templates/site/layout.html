<!doctype html>
<html lang="{{ html_lang or 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}{{ site.name }}</title>
<style>
:root { color-scheme: light dark; --ink: #1d1d1f; --soft: #6e6e73; --faint: #8e8e93; --line: #e6e6ea; --bg: #fcfcfd; --card: #ffffff; --tint: #f3f3f5; --dot: #f5b700; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --ink: #f2f2f4; --soft: #a1a1a8; --faint: #7c7c84; --line: #2a2a2e; --bg: #111113; --card: #19191c; --tint: #202024; --bad: #ff8a80; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
::selection { background: color-mix(in srgb, var(--dot) 40%, transparent); }
a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 68rem; margin: 0 auto; padding: 0 28px; }
.lang { position: fixed; top: 20px; right: 20px; z-index: 2; display: flex; padding: 3px; border-radius: 9px; background: var(--tint); font-size: 12px; }
.lang a { padding: 2px 8px; border-radius: 7px; color: var(--soft); text-decoration: none; }
.lang a[aria-current] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
main { flex-grow: 1; display: flex; align-items: center; padding: 96px 0; }
h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -.03em; font-weight: 650; margin: 0 0 16px; text-wrap: balance; }
p { margin: 0; }
.soft { color: var(--soft); }
.panel { max-width: 26rem; padding: 32px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 40px -20px rgba(0, 0, 0, .2); }
.panel h1 { font-size: 30px; }
form.stack { display: flex; flex-direction: column; gap: 16px; margin: 24px 0 20px; }
form.stack label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: var(--soft); }
form.stack input { font: inherit; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.btn { font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border: 0; border-radius: 10px;
  background: var(--ink); color: var(--bg); text-decoration: none; cursor: pointer; transition: transform .2s, opacity .2s; }
.btn:hover { opacity: .88; } .btn:active { transform: scale(.98); }
.error { margin: 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad); font-size: 14px; }
@media (max-width: 640px) {
  .wrap { padding: 0 20px; } .lang { top: 14px; right: 14px; }
}
{% block style %}{% endblock %}
</style>
</head>
<body>
<nav class="lang" aria-label="语言 / Language"><a href="?lang=zh" lang="zh-CN"{% if lang != 'en' %} aria-current="true"{% endif %}>中文</a><a href="?lang=en" lang="en"{% if lang == 'en' %} aria-current="true"{% endif %}>EN</a></nav>
<main><div class="wrap">
{% block main %}{% endblock %}
</div></main>
</body>
</html>
