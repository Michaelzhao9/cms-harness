<!doctype html>
<html lang="{{ html_lang or 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}{{ site.name }}</title>
<style>
:root { color-scheme: light dark; --ink: #1d1d1f; --soft: #6e6e73; --faint: #8e8e93; --line: #e6e6ea; --bg: #fcfcfd; --card: #ffffff; --tint: #f3f3f5; --dot: #f5b700; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --ink: #f2f2f4; --soft: #a1a1a8; --faint: #7c7c84; --line: #2a2a2e; --bg: #111113; --card: #19191c; --tint: #202024; --bad: #ff8a80; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
::selection { background: color-mix(in srgb, var(--dot) 40%, transparent); }
a { color: inherit; text-underline-offset: .2em; text-decoration-thickness: 1px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; border-radius: 6px; }
.wrap { width: 100%; max-width: 68rem; margin: 0 auto; padding: 0 28px; }
.top { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 28px; min-height: 64px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot) 25%, transparent); }
.menu { display: flex; gap: 22px; flex-grow: 1; overflow-x: auto; scrollbar-width: none; font-size: 15px; }
.menu a { color: var(--soft); text-decoration: none; white-space: nowrap; transition: color .2s; }
.menu a:hover, .menu a[aria-current] { color: var(--ink); }
.side { display: flex; align-items: center; gap: 16px; margin-left: auto; font-size: 14px; }
.side a.text { color: var(--soft); text-decoration: none; white-space: nowrap; }
.side a.text:hover { color: var(--ink); }
.lang { display: flex; padding: 3px; border-radius: 9px; background: var(--tint); font-size: 12px; }
.lang a { padding: 2px 8px; border-radius: 7px; color: var(--soft); text-decoration: none; }
.lang a[aria-current] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
main { flex-grow: 1; padding: 56px 0 96px; }
h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -.03em; font-weight: 650; margin: 0 0 16px; text-wrap: balance; }
h2 { font-size: 22px; letter-spacing: -.02em; line-height: 1.3; margin: 0; font-weight: 650; }
p { margin: 0; }
.soft { color: var(--soft); }
.lede { font-size: 19px; color: var(--soft); max-width: 36em; }
.rows { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.rows li { border-bottom: 1px solid var(--line); }
.rows a { display: flex; align-items: center; gap: 18px; padding: 18px 2px; text-decoration: none; transition: background .2s; }
.rows a:hover .t { text-decoration: underline; }
.rows .t { font-size: 17px; font-weight: 550; flex-grow: 1; min-width: 0; }
.rows .m { color: var(--faint); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: var(--tint); flex-shrink: 0; }
.empty { padding: 48px 0; color: var(--soft); border-top: 1px solid var(--line); }
img { max-width: 100%; height: auto; border-radius: 12px; }
.prose { font-size: 17px; line-height: 1.8; max-width: 40em; }
.prose img { margin: 8px 0; }
article > h1 { margin-top: 4px; margin-bottom: 28px; }
article > .prose, article > p { margin-bottom: 32px; }
.prose p { margin: 0 0 1em; }
.facts { display: grid; grid-template-columns: minmax(8rem, auto) 1fr; gap: 10px 32px; margin: 0; padding: 24px 0 0; border-top: 1px solid var(--line); max-width: 40em; }
.facts dt { color: var(--soft); font-size: 14px; padding-top: 2px; }
.facts dd { margin: 0; }
.back { display: inline-block; margin-bottom: 24px; color: var(--soft); text-decoration: none; font-size: 15px; }
.back:hover { color: var(--ink); }
.panel { max-width: 26rem; padding: 32px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 16px 40px -20px rgba(0, 0, 0, .2); }
.panel h1 { font-size: 30px; }
form.stack { display: flex; flex-direction: column; gap: 16px; margin: 24px 0 20px; }
form.stack label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: var(--soft); }
form.stack input { font: inherit; height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.btn { font: inherit; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border: 0; border-radius: 10px;
  background: var(--ink); color: var(--bg); text-decoration: none; cursor: pointer; transition: transform .2s, opacity .2s; }
.btn:hover { opacity: .88; } .btn:active { transform: scale(.98); }
.error { margin: 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad); font-size: 14px; }
.foot { border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); }
.foot .wrap { display: flex; justify-content: space-between; gap: 16px; padding-top: 22px; padding-bottom: 28px; flex-wrap: wrap; }
.foot a { color: var(--soft); text-decoration: none; }
@media (max-width: 640px) {
  .wrap { padding: 0 18px; } .top .wrap { flex-wrap: wrap; gap: 4px 16px; padding-top: 10px; padding-bottom: 10px; }
  .menu { order: 3; flex-basis: 100%; gap: 18px; } main { padding: 36px 0 72px; } .facts { grid-template-columns: 1fr; gap: 2px; } .facts dd { margin-bottom: 12px; }
}
{% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="/">{{ site.name }}</a>
{% if collections %}<nav class="menu" aria-label="{{ '栏目'|t }}">{% for c in collections %}<a href="/{{ c.name }}"{% if request.path == "/" ~ c.name or request.path is startingwith("/" ~ c.name ~ "/") %} aria-current="page"{% endif %}>{{ c.title }}</a>{% endfor %}</nav>{% endif %}
<div class="side">
{% if accounts %}{% if member %}<a class="text" href="/account/login">{{ member.name or member.email }}</a>{% else %}<a class="text" href="/account/login">{{ "登录"|t }}</a>{% endif %}{% endif %}
<nav class="lang" aria-label="语言 / Language"><a href="?lang=zh" lang="zh-CN"{% if lang != 'en' %} aria-current="true"{% endif %}>中文</a><a href="?lang=en" lang="en"{% if lang == 'en' %} aria-current="true"{% endif %}>EN</a></nav>
</div>
</div></header>
<main><div class="wrap">
{% block main %}{% endblock %}
</div></main>
<footer class="foot"><div class="wrap"><span>© {{ site.name }}</span><a href="https://github.com/Michaelzhao9/cms-harness">{{ "由 CMS Harness 驱动"|t }}</a></div></footer>
</body>
</html>
