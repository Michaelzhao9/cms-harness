{% extends "base.html" %}
{% block title %}网页{% endblock %}
{% block main %}
{%- import "icons.html" as i %}
<header class="bar">
<div class="address">
<strong>首页</strong>
<span class="url">{{ origin }}/</span>
<a class="ib sm" href="/?preview=1" target="_blank" rel="noopener" aria-label="在新标签页打开">{{ i.icon("arrow-square-out", 15) }}</a>
</div>
<a class="btn" href="/admin/publish">发布</a>
</header>
<iframe class="preview" sandbox="allow-scripts allow-forms allow-popups" src="/?preview=1" title="网站预览"></iframe>
{% endblock %}
