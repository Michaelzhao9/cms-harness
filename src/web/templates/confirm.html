{% extends "base.html" %}
{% block title %}{{ heading|t }}{% endblock %}
{% block main %}
<div class="page">
<section class="confirm" aria-labelledby="confirm-h">
<h1 id="confirm-h">{{ heading|t }}</h1>
<p>{{ message|t }}</p>
<form method="post" action="{{ action|safe }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<input type="hidden" name="confirm" value="1">
{% if note %}<input type="hidden" name="note" value="{{ note|t }}">{% endif %}
<div class="actions"><button type="submit" class="btn danger">{{ button|t }}</button><a class="txt" href="{{ back|safe }}">{{ "取消"|t }}</a></div>
</form>
</section>
</div>
{% endblock %}
