<text x="86" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="24" fill="#55555b">Say what you want. The AI builds it as a draft.</text>
<text x="86" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif" font-size="24" fill="#55555b">You look it over, then publish. One binary, one SQLite file.</text>
