[package]
name = "cms-harness"
version = "0.3.1"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
ammonia = "4"
argon2 = "0.5"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
percent-encoding = "2"
rand = "0.8"
rquickjs = "0.14"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
minijinja = { version = "2", features = ["fuel", "urlencode"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
oxc = { version = "=0.160.0", default-features = false, features = ["semantic", "transformer", "codegen"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
